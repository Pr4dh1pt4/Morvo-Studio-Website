<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-label="Ilustrasi tiga botol plastik PET bekas">
  <!-- Latar transparan: botol langsung menempel pada latar halaman.
       Bagian bawah botol sengaja terpotong tepi gambar. -->
  <defs>
    <!-- Badan botol kiri: bening kebiruan -->
    <linearGradient id="body-blue" x1="0" x2="1">
      <stop offset="0" stop-color="#9CC8DA" stop-opacity=".95"/>
      <stop offset=".22" stop-color="#E4F2F8" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#CBE5F0" stop-opacity=".88"/>
      <stop offset=".85" stop-color="#B3D6E5" stop-opacity=".92"/>
      <stop offset="1" stop-color="#86B7CB" stop-opacity=".96"/>
    </linearGradient>
    <!-- Badan botol tengah: bening netral -->
    <linearGradient id="body-clear" x1="0" x2="1">
      <stop offset="0" stop-color="#B9C6CA" stop-opacity=".96"/>
      <stop offset=".12" stop-color="#F4F7F7" stop-opacity=".93"/>
      <stop offset=".5" stop-color="#E3E9EA" stop-opacity=".9"/>
      <stop offset=".88" stop-color="#EEF2F2" stop-opacity=".93"/>
      <stop offset="1" stop-color="#A9B7BC" stop-opacity=".96"/>
    </linearGradient>
    <!-- Badan botol kanan: buram berembun -->
    <linearGradient id="body-frost" x1="0" x2="1">
      <stop offset="0" stop-color="#C5D6DD" stop-opacity=".96"/>
      <stop offset=".3" stop-color="#F7FAFB" stop-opacity=".94"/>
      <stop offset=".7" stop-color="#E8EFF2" stop-opacity=".92"/>
      <stop offset="1" stop-color="#B4C7CF" stop-opacity=".96"/>
    </linearGradient>
    <!-- Tutup -->
    <linearGradient id="cap-wood" x1="0" x2="1">
      <stop offset="0" stop-color="#B07D55"/><stop offset=".45" stop-color="#8B5E3C"/><stop offset="1" stop-color="#5E3D24"/>
    </linearGradient>
    <linearGradient id="cap-ink" x1="0" x2="1">
      <stop offset="0" stop-color="#3A423E"/><stop offset=".45" stop-color="#1C2420"/><stop offset="1" stop-color="#0B0F0D"/>
    </linearGradient>
    <linearGradient id="cap-blue" x1="0" x2="1">
      <stop offset="0" stop-color="#3D7FD0"/><stop offset=".45" stop-color="#1F5FAF"/><stop offset="1" stop-color="#143F78"/>
    </linearGradient>
    <!-- Gelap lembut di leher (ketebalan plastik) -->
    <linearGradient id="neck-shade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7FA8B8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7FA8B8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur-hl" x="-50%" y="-10%" width="200%" height="120%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="blur-sm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="drop" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1C2420" flood-opacity=".18"/>
    </filter>
    <g id="cap-ridges" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="3">
      <path d="M14 8V64M26 8V64M38 8V64M50 8V64M62 8V64M74 8V64M86 8V64M98 8V64"/>
    </g>
  </defs>

  <!-- ============ Botol kiri: bergelombang, tutup kayu ============ -->
  <g transform="translate(150 230) rotate(-4 160 700)" filter="url(#drop)">
    <path d="M120 88H200V140C200 190 320 200 315 280C310 360 300 420 312 500C322 580 300 640 296 720C292 800 318 860 318 960V1300H2V960C2 860 28 800 24 720C20 640 -2 580 8 500C20 420 10 360 5 280C0 200 120 190 120 140Z"
      fill="url(#body-blue)" stroke="#6E9FB3" stroke-opacity=".6" stroke-width="3"/>
    <path d="M120 100H200V170C190 200 130 200 120 170Z" fill="url(#neck-shade)"/>
    <!-- lipatan gelombang -->
    <g fill="none" stroke="#7FAEC1" stroke-opacity=".45" stroke-width="3">
      <path d="M20 500Q160 530 300 500"/><path d="M28 720Q160 750 292 720"/><path d="M14 600Q160 625 306 600" stroke-opacity=".25"/>
    </g>
    <!-- kilau -->
    <path d="M52 300C42 420 50 520 44 640C40 760 52 880 50 1000" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="22" stroke-linecap="round" fill="none" filter="url(#blur-hl)"/>
    <path d="M92 320C88 380 90 430 92 470" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M272 330C282 420 276 470 284 540" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#blur-sm)"/>
    <path d="M140 150C120 190 70 210 48 250" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- cincin leher + tutup -->
    <rect x="96" y="74" width="128" height="16" rx="8" fill="#D6EAF2" stroke="#6E9FB3" stroke-opacity=".6" stroke-width="2"/>
    <rect x="104" y="0" width="112" height="72" rx="10" fill="url(#cap-wood)"/>
    <g transform="translate(108 0)"><use href="#cap-ridges"/></g>
    <rect x="104" y="0" width="112" height="10" rx="5" fill="#FFFFFF" fill-opacity=".18"/>
  </g>

  <!-- ============ Botol kanan: meruncing, berembun, tutup biru ============ -->
  <g transform="translate(790 300) rotate(7 150 700)" filter="url(#drop)">
    <path d="M110 92H190V140C190 200 300 220 300 300C300 520 292 700 286 900C282 1050 280 1150 280 1300H20C20 1150 18 1050 14 900C8 700 0 520 0 300C0 220 110 200 110 140Z"
      fill="url(#body-frost)" stroke="#8FAAB5" stroke-opacity=".6" stroke-width="3"/>
    <path d="M110 100H190V170C180 200 120 200 110 170Z" fill="url(#neck-shade)"/>
    <!-- embun -->
    <g fill="#FFFFFF" fill-opacity=".85" stroke="#9FB6C0" stroke-opacity=".5" stroke-width="1">
      <circle cx="210" cy="380" r="5"/><circle cx="240" cy="430" r="3.5"/><circle cx="190" cy="470" r="4"/>
      <circle cx="255" cy="520" r="6"/><circle cx="220" cy="580" r="3"/><circle cx="170" cy="610" r="4.5"/>
      <circle cx="245" cy="650" r="3.5"/><circle cx="200" cy="700" r="5.5"/><circle cx="260" cy="760" r="4"/>
      <circle cx="150" cy="790" r="3"/><circle cx="225" cy="830" r="4.5"/><circle cx="185" cy="890" r="3.5"/>
      <circle cx="250" cy="940" r="5"/><circle cx="130" cy="980" r="4"/><circle cx="210" cy="1030" r="3"/>
      <circle cx="160" cy="430" r="2.5"/><circle cx="120" cy="540" r="3"/><circle cx="95" cy="700" r="2.5"/>
      <circle cx="235" cy="1100" r="4"/><circle cx="175" cy="1150" r="3"/>
    </g>
    <path d="M44 340C36 520 40 720 46 1000" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="20" stroke-linecap="round" fill="none" filter="url(#blur-hl)"/>
    <path d="M128 150C110 200 60 220 40 270" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="8" stroke-linecap="round" fill="none"/>
    <rect x="86" y="78" width="128" height="16" rx="8" fill="#E2EBEE" stroke="#8FAAB5" stroke-opacity=".6" stroke-width="2"/>
    <rect x="94" y="0" width="112" height="76" rx="10" fill="url(#cap-blue)"/>
    <g transform="translate(98 2)"><use href="#cap-ridges"/></g>
    <rect x="94" y="0" width="112" height="10" rx="5" fill="#FFFFFF" fill-opacity=".22"/>
  </g>

  <!-- ============ Botol tengah: lurus, paling depan, tutup hitam ============ -->
  <g transform="translate(410 40)" filter="url(#drop)">
    <path d="M128 100H232V150C232 200 360 205 360 275V1400H0V275C0 205 128 200 128 150Z"
      fill="url(#body-clear)" stroke="#9AAAB0" stroke-opacity=".7" stroke-width="3"/>
    <path d="M128 110H232V185C220 215 140 215 128 185Z" fill="url(#neck-shade)" opacity=".7"/>
    <!-- alur bahu dan dasar -->
    <g fill="none" stroke="#A5B4B9" stroke-opacity=".55" stroke-width="2.5">
      <path d="M40 232Q180 260 320 232"/>
      <path d="M4 330Q180 352 356 330"/>
      <path d="M4 1110Q180 1132 356 1110"/><path d="M4 1138Q180 1160 356 1138"/>
      <path d="M4 1166Q180 1188 356 1166"/><path d="M4 1194Q180 1216 356 1194"/>
      <path d="M4 1222Q180 1244 356 1222"/><path d="M4 1250Q180 1272 356 1250"/>
    </g>
    <!-- kilau -->
    <path d="M38 300V1300" stroke="#FFFFFF" stroke-opacity=".95" stroke-width="26" stroke-linecap="round" filter="url(#blur-hl)"/>
    <path d="M78 320V760" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="8" stroke-linecap="round"/>
    <path d="M324 340V1250" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="10" stroke-linecap="round" filter="url(#blur-sm)"/>
    <path d="M150 160C130 205 70 222 40 262" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- cincin leher + tutup -->
    <rect x="108" y="84" width="144" height="18" rx="9" fill="#EEF2F2" stroke="#9AAAB0" stroke-opacity=".7" stroke-width="2"/>
    <rect x="116" y="0" width="128" height="82" rx="12" fill="url(#cap-ink)"/>
    <g transform="translate(124 4) scale(1.1 1)"><use href="#cap-ridges"/></g>
    <rect x="116" y="0" width="128" height="10" rx="5" fill="#FFFFFF" fill-opacity=".14"/>
  </g>
</svg>
